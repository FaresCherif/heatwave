<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="src/styles/stylesheet.css">
    <link rel="stylesheet" href="src/styles/stylesheet_bars.css">
    <link rel="stylesheet" href="src/styles/stylesheet_gameover.css">
    <link rel="stylesheet" href="src/styles/stylesheet_work.css">
    <link rel="stylesheet" href="src/styles/stylesheet_cool.css">
    <link rel="stylesheet" href="src/styles/stylesheet_menu.css">
    <link rel="stylesheet" href="src/styles/stylesheet_effects.css">
    <link rel="stylesheet" href="src/styles/stylesheet_tutorial.css">

    <script src="src/scriptLevels.js"></script>
    <script src="src/scriptTutorial.js"></script>
    <script src="src/scriptMoney.js"></script>
    <script src="src/scrpitBar.js"></script>
    <script src="src/scriptClock.js"></script>
    <script src="src/scriptGame.js"></script>
    <script src="src/scriptEffects.js"></script>
    <script src="src/scriptInteraction.js"></script>
    <script src="src/scriptMenu.js"></script>

</head>
<body>
    <!-- Interface fixe en haut de l'écran -->
    <div class="hud">
        <div class="hud-info">
            <div class="level-label"></div>
            <div class="clock">08:00</div>
            <div class="day-pay"></div>
            <div class="total-money"></div>
        </div>

        <div id="workModeIndicator" class="active" data-mode="idle">
            MODE REPOS
            <div id="alternateIndicator"></div>
        </div>

        <div class="bars-container">
            <div class="stat-bar">
                <label>💼 Travail</label>
                <div class="bar-bg">
                    <div class="work-bar-fill"></div>
                    <div class="work-threshold"></div>
                </div>
            </div>
            <div class="stat-bar">
                <label>🌡️ Chaleur</label>
                <div class="bar-bg">
                    <div class="heat-bar-fill"></div>
                    <div class="heat-threshold"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tutoriel guidé du niveau 1 -->
    <div class="tutorial hidden" id="tutorial">
        <div class="tutorial-header">
            <span>TUTORIEL</span>
            <span id="tutorialStep"></span>
        </div>
        <p id="tutorialText"></p>
        <div id="tutorialProgress"></div>
        <div class="tutorial-buttons">
            <button id="tutorialNext" onclick="this.blur(); nextTutorialStep()"></button>
            <button class="tutorial-skip" onclick="this.blur(); endTutorial()">Passer le tutoriel</button>
        </div>
    </div>

    <div class="room">
        <div class="background">

            <div class="start-menu" id="startMenu">
                <div class="menu-content">
                    <h1>HEATWAVE</h1>
                    <p>Gérez votre température et votre productivité</p>
                    <button onclick="startGame()">DÉMARRER</button>
                </div>
            </div>

            <div class="pause-menu hidden" id="pauseMenu">
                <div class="menu-content">
                    <h1>PAUSE</h1>
                    <p>Le jeu est en pause. Appuyez sur Échap ou reprendre pour continuer.</p>
                    <button onclick="resumeGame()">REPRENDRE</button>
                    <button onclick="restartGame()">REDÉMARRER</button>
                </div>
            </div>

            <div class="level-menu hidden" id="levelMenu">
                <div class="menu-content">
                    <h1 id="levelMenuTitle"></h1>
                    <p id="levelMenuPay"></p>
                    <p id="levelMenuText"></p>
                    <button id="levelMenuButton" onclick="nextLevel()"></button>
                </div>
            </div>

            <div class="game-over-screen" id="gameOverScreen">
                <div class="game-over-content">
                    <h1>GAME OVER</h1>
                    <p id="gameOverReason"></p>
                    <button onclick="restartGame()">Recommencer</button>
                </div>
            </div>

            <img class="decor" src="src/images/background.png"/>
            <div class="sprite bureau"><img src="src/images/simpledesk.png"/></div>
            <div class="sprite computer"><img src="src/images/computer.png"/></div>
            <div class="sprite handfan"><img src="src/images/handfan.png"></div>
            <div class="sprite joueur"><img src="src/images/user.png"></div>
        </div>
    </div>
</body>

</html>
