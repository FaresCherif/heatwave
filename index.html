<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="src/styles/stylesheet.css">
    <link rel="stylesheet" href="src/styles/stylesheet_bars.css">
    <link rel="stylesheet" href="src/styles/stylesheet_gameover.css">
    <link rel="stylesheet" href="src/styles/stylesheet_work.css">
    <link rel="stylesheet" href="src/styles/stylesheet_cool.css">
    <link rel="stylesheet" href="src/styles/stylesheet_menu.css">

    <script src="src/scriptLevels.js"></script>
    <script src="src/scrpitBar.js"></script>
    <script src="src/scriptClock.js"></script>
    <script src="src/scriptGame.js"></script>
    <script src="src/scriptInteraction.js"></script>
    <script src="src/scriptMenu.js"></script>

</head>
<body>
    <div id="workModeIndicator" class="active" data-mode="idle">
        MODE REPOS
        <div id="alternateIndicator"></div>
    </div>

    <div class="room">
        <div class="background">

            <div class="start-menu" id="startMenu">
                <div class="menu-content">
                    <h1>HEATWAVE</h1>
                    <p>Gérez votre température et votre productivité</p>
                    <button onclick="startGame()">DÉMARRER</button>
                </div>
            </div>

            <div class="pause-menu hidden" id="pauseMenu">
                <div class="menu-content">
                    <h1>PAUSE</h1>
                    <p>Le jeu est en pause. Appuyez sur Échap ou reprendre pour continuer.</p>
                    <button onclick="resumeGame()">REPRENDRE</button>
                    <button onclick="restartGame()">REDÉMARRER</button>
                </div>
            </div>

            <div class="level-menu hidden" id="levelMenu">
                <div class="menu-content">
                    <h1 id="levelMenuTitle"></h1>
                    <p id="levelMenuText"></p>
                    <button id="levelMenuButton" onclick="nextLevel()"></button>
                </div>
            </div>

            <div class="game-over-screen" id="gameOverScreen">
                <div class="game-over-content">
                    <h1>GAME OVER</h1>
                    <p id="gameOverReason"></p>
                    <button onclick="restartGame()">Recommencer</button>
                </div>
            </div>

            <div class="bars-container">
                <div class="stat-bar-vertical">
                    <label>Travail</label>
                    <div class="bar-bg">
                        <div class="work-bar-fill"></div>
                    </div>
                </div>
                <div class="stat-bar-vertical">
                    <label>Chaleur</label>
                    <div class="bar-bg">
                        <div class="heat-bar-fill"></div>
                    </div>
                </div>
            </div>

            <div class="level-label"></div>
            <div class="clock"></div>
            <img src="src/images/background.png"/>
            <div class="bureau"><img src="src/images/simpledesk.png"/></div>
            <div class="computer"><img src="src/images/computer.png"/></div>
            <div class="joueur"><img src="src/images/user.png"></div>
            <div class="handfan"><img src="src/images/handfan.png"></div>
        </div>
    </div>
</body>

</html>
