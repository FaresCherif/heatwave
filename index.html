<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Heatwave : survivez à une journée de bureau pendant la canicule, entre productivité et coups de chaud.">
    <title>Heatwave</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌡️</text></svg>">

    <link rel="stylesheet" href="src/styles/scene.css">
    <link rel="stylesheet" href="src/styles/hud.css">
    <link rel="stylesheet" href="src/styles/screens.css">
    <link rel="stylesheet" href="src/styles/effects.css">
    <link rel="stylesheet" href="src/styles/tutorial.css">
    <link rel="stylesheet" href="src/styles/dialogue.css">
    <link rel="stylesheet" href="src/styles/form.css">
    <link rel="stylesheet" href="src/styles/copy.css">

    <script type="module" src="src/main.js"></script>
</head>
<body>
    <!-- Interface fixe en haut de l'écran -->
    <div class="hud">
        <div class="hud-info">
            <div class="level-label"></div>
            <div class="clock">08:00</div>
            <div class="day-pay"></div>
            <div class="total-money"></div>
            <div class="hud-items"></div>
        </div>

        <div id="workModeIndicator" data-mode="idle">
            <span id="modeLabel">MODE REPOS</span>
            <div id="alternateIndicator"></div>
        </div>

        <div class="bars-container">
            <div class="stat-bar">
                <label>💼 Travail</label>
                <div class="bar-bg">
                    <div class="work-bar-fill"></div>
                    <div class="work-threshold"></div>
                </div>
            </div>
            <div class="stat-bar">
                <label>🌡️ Chaleur</label>
                <div class="bar-bg">
                    <div class="heat-bar-fill"></div>
                    <div class="heat-threshold"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tutoriel guidé du niveau 1 -->
    <div class="tutorial hidden" id="tutorial">
        <div class="tutorial-header">
            <span>TUTORIEL</span>
            <span id="tutorialStep"></span>
        </div>
        <p id="tutorialText"></p>
        <div id="tutorialProgress"></div>
        <div class="tutorial-buttons">
            <button id="tutorialNext"></button>
            <button id="tutorialSkip" class="tutorial-skip">Passer le tutoriel</button>
        </div>
    </div>

    <!-- Fiche du nouvel employé, à remplir pendant la journée (textes : data-i18n, voir src/i18n) -->
    <button class="form-toggle hidden" id="formToggle" aria-controls="employeeForm" aria-expanded="false">
        <span data-i18n="form.open"></span>
        <small id="formToggleDeadline"></small>
    </button>

    <div class="employee-form hidden" id="employeeForm">
        <form class="form-paper" id="employeeFormFields" autocomplete="off" novalidate>
            <header class="form-header">
                <button type="button" class="form-close" id="formClose" data-i18n="form.close"></button>
                <h2 data-i18n="form.title"></h2>
                <p data-i18n="form.subtitle"></p>
                <strong class="form-deadline" id="formDeadline"></strong>
            </header>

            <label class="form-field">
                <span data-i18n="form.name"></span>
                <input id="formName" name="name" maxlength="30">
            </label>

            <fieldset class="form-field">
                <legend data-i18n="form.sex"></legend>
                <div class="form-choices">
                    <label><input type="radio" name="sex" value="male"> <span data-i18n="form.male"></span></label>
                    <label><input type="radio" name="sex" value="female"> <span data-i18n="form.female"></span></label>
                    <label><input type="radio" name="sex" value="other"> <span data-i18n="form.other"></span></label>
                </div>
            </fieldset>

            <label class="form-field">
                <span data-i18n="form.age"></span>
                <input name="age" type="number" min="16" max="99">
            </label>

            <h3 data-i18n="form.ratings"></h3>
            <div id="formRatings"></div>

            <button type="submit" id="formSubmit" data-i18n="form.submit"></button>
        </form>
    </div>

    <!-- Gratte-papier : phrases à recopier, entre les deux zones d'appels urgents -->
    <button class="form-toggle copy-toggle hidden" id="copyToggle" aria-controls="copyTask" aria-expanded="false">
        <span data-i18n="copy.open"></span>
        <small id="copyToggleDeadline"></small>
    </button>

    <div class="copy-task hidden" id="copyTask">
        <div class="form-paper copy-paper">
            <header class="form-header">
                <button type="button" class="form-close" id="copyClose" data-i18n="copy.close"></button>
                <h2 data-i18n="copy.title"></h2>
                <p data-i18n="copy.subtitle"></p>
                <strong class="form-deadline" id="copyDeadline"></strong>
                <span class="copy-progress" id="copyProgress"></span>
            </header>
            <p class="copy-model" id="copyModel"></p>
            <input class="copy-input" id="copyInput" autocomplete="off" spellcheck="false">
        </div>
    </div>

    <div class="room">
        <div class="background">

            <div class="overlay" id="startMenu">
                <div class="menu-content">
                    <h1>HEATWAVE</h1>
                    <p>Gérez votre température et votre productivité</p>
                    <button id="startButton">DÉMARRER</button>
                </div>
            </div>

            <!-- Écran secret : code ↑ ↑ ↓ ↓ ← → ← → Entrée sur le menu de démarrage ou de pause -->
            <div class="overlay hidden" id="levelSelect">
                <div class="menu-content level-select">
                    <h1 data-i18n="levelSelect.title"></h1>
                    <p data-i18n="levelSelect.subtitle"></p>
                    <div class="level-select-list" id="levelSelectList"></div>
                    <button id="levelSelectBack" class="level-select-back" data-i18n="levelSelect.back"></button>
                </div>
            </div>

            <div class="overlay hidden" id="pauseMenu">
                <div class="menu-content">
                    <h1>PAUSE</h1>
                    <p>Le jeu est en pause. Appuyez sur Échap ou reprendre pour continuer.</p>
                    <div class="menu-buttons">
                        <button id="resumeButton">REPRENDRE</button>
                        <button id="restartLevelButton" class="secondary">RELANCER LE NIVEAU</button>
                        <button id="restartButton" class="secondary">REDÉMARRER</button>
                    </div>
                </div>
            </div>

            <div class="overlay hidden" id="levelMenu">
                <div class="menu-content">
                    <h1 id="levelMenuTitle"></h1>
                    <p id="levelMenuPay" class="menu-highlight"></p>
                    <p id="levelMenuText"></p>
                    <button id="levelMenuButton"></button>
                </div>
            </div>

            <!-- Boutique entre deux niveaux (objets : src/config/shop.js) -->
            <div class="overlay hidden" id="shopScreen">
                <div class="menu-content shop">
                    <h1 data-i18n="shop.title"></h1>
                    <p id="shopMoney" class="menu-highlight"></p>
                    <div class="shop-items" id="shopItems"></div>
                    <button id="shopContinue" data-i18n="shop.continue"></button>
                </div>
            </div>

            <div class="overlay hidden" id="gameOverScreen">
                <div class="menu-content game-over">
                    <h1>GAME OVER</h1>
                    <p id="gameOverReason"></p>
                    <button id="retryButton">RECOMMENCER</button>
                </div>
            </div>

            <!-- Appel téléphonique de l'histoire -->
            <div class="dialogue hidden" id="dialogue">
                <div class="dialogue-phone">
                    <img src="src/images/phone.png" alt="Téléphone">
                </div>
                <div class="dialogue-bubble">
                    <div class="dialogue-caller" id="dialogueCaller"></div>
                    <p id="dialogueText"></p>
                    <div class="dialogue-hint" id="dialogueHint"></div>
                </div>
                <button class="dialogue-skip" id="dialogueSkip">Passer l'appel</button>
            </div>

            <img class="decor" src="src/images/background.png" alt="">
            <div class="sprite bureau"><img src="src/images/simpledesk.png" alt="Bureau"></div>
            <div class="sprite computer"><img src="src/images/computer.png" alt="Ordinateur"></div>
            <div class="sprite handfan"><img src="src/images/handfan.png" alt="Éventail"></div>
            <div class="sprite joueur"><img src="src/images/user.png" alt="Joueur"></div>
        </div>
    </div>
</body>
</html>
