<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Heatwave : survivez à une journée de bureau pendant la canicule, entre productivité et coups de chaud.">
    <title>Heatwave</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌡️</text></svg>">

    <link rel="stylesheet" href="src/styles/scene.css">
    <link rel="stylesheet" href="src/styles/hud.css">
    <link rel="stylesheet" href="src/styles/screens.css">
    <link rel="stylesheet" href="src/styles/effects.css">
    <link rel="stylesheet" href="src/styles/tutorial.css">

    <script type="module" src="src/main.js"></script>
</head>
<body>
    <!-- Interface fixe en haut de l'écran -->
    <div class="hud">
        <div class="hud-info">
            <div class="level-label"></div>
            <div class="clock">08:00</div>
            <div class="day-pay"></div>
            <div class="total-money"></div>
        </div>

        <div id="workModeIndicator" data-mode="idle">
            <span id="modeLabel">MODE REPOS</span>
            <div id="alternateIndicator"></div>
        </div>

        <div class="bars-container">
            <div class="stat-bar">
                <label>💼 Travail</label>
                <div class="bar-bg">
                    <div class="work-bar-fill"></div>
                    <div class="work-threshold"></div>
                </div>
            </div>
            <div class="stat-bar">
                <label>🌡️ Chaleur</label>
                <div class="bar-bg">
                    <div class="heat-bar-fill"></div>
                    <div class="heat-threshold"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tutoriel guidé du niveau 1 -->
    <div class="tutorial hidden" id="tutorial">
        <div class="tutorial-header">
            <span>TUTORIEL</span>
            <span id="tutorialStep"></span>
        </div>
        <p id="tutorialText"></p>
        <div id="tutorialProgress"></div>
        <div class="tutorial-buttons">
            <button id="tutorialNext"></button>
            <button id="tutorialSkip" class="tutorial-skip">Passer le tutoriel</button>
        </div>
    </div>

    <div class="room">
        <div class="background">

            <div class="overlay" id="startMenu">
                <div class="menu-content">
                    <h1>HEATWAVE</h1>
                    <p>Gérez votre température et votre productivité</p>
                    <button id="startButton">DÉMARRER</button>
                </div>
            </div>

            <div class="overlay hidden" id="pauseMenu">
                <div class="menu-content">
                    <h1>PAUSE</h1>
                    <p>Le jeu est en pause. Appuyez sur Échap ou reprendre pour continuer.</p>
                    <button id="resumeButton">REPRENDRE</button>
                    <button id="restartButton">REDÉMARRER</button>
                </div>
            </div>

            <div class="overlay hidden" id="levelMenu">
                <div class="menu-content">
                    <h1 id="levelMenuTitle"></h1>
                    <p id="levelMenuPay" class="menu-highlight"></p>
                    <p id="levelMenuText"></p>
                    <button id="levelMenuButton"></button>
                </div>
            </div>

            <div class="overlay hidden" id="gameOverScreen">
                <div class="menu-content game-over">
                    <h1>GAME OVER</h1>
                    <p id="gameOverReason"></p>
                    <button id="retryButton">RECOMMENCER</button>
                </div>
            </div>

            <img class="decor" src="src/images/background.png" alt="">
            <div class="sprite bureau"><img src="src/images/simpledesk.png" alt="Bureau"></div>
            <div class="sprite computer"><img src="src/images/computer.png" alt="Ordinateur"></div>
            <div class="sprite handfan"><img src="src/images/handfan.png" alt="Éventail"></div>
            <div class="sprite joueur"><img src="src/images/user.png" alt="Joueur"></div>
        </div>
    </div>
</body>
</html>
